services:
  - type: web
    name: dratido
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /healthz
    # One worker on purpose: conversations and background generation jobs live in memory.
    # Threads let polling requests answer while a memorial is being generated; the longer
    # timeout covers slow AI replies and rate-limit waits.
    startCommand: gunicorn dratido_app:app --workers 1 --threads 8 --timeout 180
    envVars:
      - key: GROQ_API_KEY
        sync: false                 # secret — set manually in the Render dashboard, not committed
      - key: PYTHON_VERSION
        value: 3.11.9
